server {
    listen       80;
    server_name  localhost;

    root  /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    # Compresión (RNF-04 rendimiento)
    gzip on;
    gzip_types text/css text/html application/javascript image/svg+xml;

    # Cabeceras de seguridad básicas (RNF-01)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # API de RIUL (contenedor "api"): registro y acceso de usuarios
    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 20k;
    }

    # Cache estático
    location ~* \.(css|jpg|png|svg|woff2)$ {
        expires 7d;
        access_log off;
    }

    error_page 404 /404.html;
}
